# ============================================
#  CONFIGURACIÓN DEL SITIO
# ============================================

title: "feynman72 - Knowledge Base"
tagline: "Mis notas, laboratorios y aprendizajes"
description: "Una base del poco conocimiento adquirido mediante experiencia"
lang: es

url: "https://feynman72.github.io"
baseurl: ""

author:
  name: "feynman72"
  github: "feynman72"          
  linkedin: ""                   
  email: "sosa.francisco0203@gmail.com"                     


markdown: kramdown
highlighter: rouge
permalink: /bitacora/:year/:month/:title/
timezone: America/Mexico_City


collections:
  notas:
    output: true
    permalink: /notas/:path/

defaults:
  - scope:
      path: ""
      type: "notas"
    values:
      layout: "nota"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
