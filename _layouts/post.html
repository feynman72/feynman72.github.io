---
layout: default
---
<article class="post">
  <header class="post-header">
    <a class="back" href="{{ '/bitacora/' | relative_url }}">&larr; Volver a la bitácora</a>
    <h1>{{ page.title }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d/%m/%Y" }}</time>
      {% if page.tags and page.tags.size > 0 %}
        <span class="dot">·</span>
        {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
      {% endif %}
    </p>
  </header>

  <div class="post-body">
    {{ content }}
  </div>
</article>
