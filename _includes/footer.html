<footer class="site-footer">
  <div class="wrap wide foot">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.author.name }}. Escrito y documentado por mí.</p>
    <p class="links">
      {% if site.author.github != "" %}<a href="https://github.com/{{ site.author.github }}">GitHub</a>{% endif %}
      {% if site.author.linkedin != "" %}<a href="https://www.linkedin.com/in/{{ site.author.linkedin }}">LinkedIn</a>{% endif %}
      {% if site.author.email != "" %}<a href="mailto:{{ site.author.email }}">Correo</a>{% endif %}
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </p>
  </div>
</footer>
